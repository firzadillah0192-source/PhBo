services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: photobooth
      POSTGRES_PASSWORD: photobooth
      POSTGRES_DB: photobooth
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobooth -d photobooth"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
  migrate:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://photobooth:photobooth@postgres:5432/photobooth?schema=public
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    profiles: [app]
    restart: unless-stopped
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgresql://photobooth:photobooth@postgres:5432/photobooth?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
  worker:
    build: .
    profiles: [app]
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_started }
volumes:
  postgres-data:
  minio-data:
