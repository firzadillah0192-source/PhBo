# ---------------------------------------------------------------------------
# Photobooth AI — container-internal nginx for photobooth-web.
#
# Serves the built React bundle and reverse-proxies /api to photobooth-api over
# the dedicated photobooth-net Docker network. The API is therefore reachable
# from the browser without exposing Postgres/Redis or changing any host-level
# reverse proxy configuration (spec sections 7 + 8).
# ---------------------------------------------------------------------------

# Opaque claim tokens are bearer credentials carried in URL path segments.
# Keep access logs useful while replacing those path values with a marker.
map $request_uri $photobooth_safe_request_uri {
    ~^/api/public/results/ /api/public/results/[REDACTED];
    ~^/r/                  /r/[REDACTED];
    default                $request_uri;
}

log_format photobooth_safe '$remote_addr - $remote_user [$time_local] "$request_method $photobooth_safe_request_uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout photobooth_safe;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be several MB of photo data.
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- API reverse proxy -------------------------------------------------
    # Claim tokens are bearer credentials in these path segments. Do not put
    # them in the web container's access log.
    location ^~ /api/public/results/ {
        set $photobooth_api http://photobooth-api:8000;
        proxy_pass $photobooth_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # No trailing slash on proxy_pass, so the /api prefix is preserved — the
    # backend routes are all mounted under /api.
    location /api/ {
        # Resolve the Compose service through Docker DNS at request time. The
        # API container can be recreated and receive a new IP without leaving
        # this proxy pointed at the old address.
        set $photobooth_api http://photobooth-api:8000;
        proxy_pass $photobooth_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation itself is async (202 + polling), but result downloads can
        # be large, so allow generous read time.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # --- Static app --------------------------------------------------------
    # Hashed build assets are immutable and safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must never be cached, or deploys will not be picked up.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback for phone QR opens and refreshes; never log bearer tokens.
    location ^~ /r/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
