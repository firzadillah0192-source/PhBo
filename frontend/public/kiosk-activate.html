<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Aktifkan kiosk · NXBooth</title>
<style>
@font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url('/fonts/baloo2-extrabold.ttf') format('truetype')}
:root{--paper:#fff4dd;--white:#fffdf7;--ink:#26201a;--muted:#665b4c;--accent:#ac3515;--sun:#ffda50;--orange:#ff693b;--rose:#ffbdd0;--mint:#c4e5b4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 20px}
.logo{font-family:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1}.logo span{color:var(--accent)}
h1{font-family:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:800;font-size:clamp(32px,8vw,44px);letter-spacing:-.025em;line-height:1.1;margin:28px 0 8px}
p{color:var(--muted);margin:8px 0 16px}
.card{background:var(--white);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:22px;margin-top:20px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--ink);border-radius:9px;background:var(--white);color:var(--ink);font:800 28px/1 'Baloo 2',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:center}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;margin-top:14px;padding:12px 24px;border:2px solid var(--ink);border-radius:9px;background:var(--orange);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font:800 16px system-ui,sans-serif;text-decoration:none;cursor:pointer}
button:hover:not(:disabled){background:var(--sun)}button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
button:disabled{opacity:.55;box-shadow:none;cursor:default}
button.plain{background:var(--white);margin-left:8px}
input:focus-visible,button:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.msg{margin:16px 0 0;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;font-weight:700;color:var(--ink)}
.msg.err{background:var(--rose)}.msg.ok{background:var(--mint)}
.device{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:26px;margin:4px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="logo">NX<span>Booth</span></div>
  <h1>Aktifkan kiosk</h1>
  <p>Masukkan kode yang tampil di layar komputer kiosk. Hanya akun staf yang diizinkan admin yang bisa menyetujuinya.</p>
  <section class="card" id="step-code">
    <form id="lookup" autocomplete="off">
      <label for="code">Kode di layar kiosk</label>
      <input id="code" name="code" type="text" maxlength="9" inputmode="text" enterkeyhint="go" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="ABCD-2345" required autofocus>
      <button id="check" type="submit">Cek kode</button>
    </form>
  </section>
  <section class="card" id="step-confirm" hidden>
    <p>Izinkan komputer ini memakai NXBooth dengan akun Anda?</p>
    <div class="device" id="device"></div>
    <p id="expires"></p>
    <button id="approve" type="button">Izinkan</button><button id="back" class="plain" type="button">Batal</button>
  </section>
  <div id="message" role="status" aria-live="polite" hidden></div>
  <a class="btn" id="signin" href="/" hidden>Masuk ke NXBooth dulu</a>
</main>
<script data-cfasync="false">
(function(){
  var $=function(id){return document.getElementById(id)};
  var message=$('message'),code=$('code'),CODES={
    AUTHENTICATION_REQUIRED:'Anda belum masuk. Masuk ke NXBooth, lalu buka halaman ini lagi.',
    KIOSK_FORBIDDEN:'Akun ini belum diizinkan mengaktifkan kiosk. Minta admin memberi peran Kiosk operator.',
    DEVICE_CODE_NOT_FOUND:'Kode tidak ditemukan atau sudah kedaluwarsa. Periksa kode di layar kiosk.',
    DEVICE_ALREADY_APPROVED:'Kode ini sudah disetujui.',RATE_LIMITED:'Terlalu banyak percobaan. Tunggu sebentar.'};
  function show(text,kind){message.textContent=text;message.className='msg '+kind;message.hidden=false}
  function clear(){message.hidden=true;$('signin').hidden=true}
  function post(path){
    return fetch('/api/desktop-device/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({user_code:code.value})})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(b){if(!r.ok){var e=new Error((b.error&&b.error.code)||(r.status===429?'RATE_LIMITED':'ERROR'));e.status=r.status;throw e}return b.data})});
  }
  function fail(e){
    show(CODES[e.message]||'Terjadi kesalahan. Coba lagi.','err');
    $('signin').hidden=e.message!=='AUTHENTICATION_REQUIRED';
    $('check').disabled=false;$('approve').disabled=false;
  }
  $('lookup').addEventListener('submit',function(ev){
    ev.preventDefault();clear();$('check').disabled=true;
    post('lookup').then(function(d){
      $('device').textContent=d.device_name;
      $('expires').textContent=d.approved?'Kode ini sudah disetujui.':'Kode berlaku sekitar '+Math.max(1,Math.round(d.expires_in/60))+' menit lagi.';
      $('approve').disabled=!!d.approved;
      $('step-code').hidden=true;$('step-confirm').hidden=false;$('check').disabled=false;
    }).catch(fail);
  });
  $('approve').addEventListener('click',function(){
    clear();$('approve').disabled=true;
    post('approve').then(function(d){
      $('step-confirm').hidden=true;show(d.device_name+' sudah diaktifkan. Kiosk akan masuk dalam beberapa detik.','ok');
    }).catch(fail);
  });
  $('back').addEventListener('click',function(){clear();$('step-confirm').hidden=true;$('step-code').hidden=false;code.value='';code.focus()});
})();
</script>
</body>
</html>
