# Separate media process. Authentication and upload validation remain in API.

limit_conn_zone $binary_remote_addr zone=photobooth_media:10m;
log_format photobooth_media '$request_id $request_method $status $body_bytes_sent $request_time';
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $photobooth_api http://photobooth-api:8081;
    client_max_body_size 50m;
    client_body_timeout 60s;
    access_log /dev/stdout photobooth_media;
    error_log /dev/null;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "private, no-store" always;
    limit_conn photobooth_media 4;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    location = /media/health { access_log off; return 200 '{"status":"ok","service":"photobooth-media-entry"}'; }
    location ~ "^/api/v1/kiosk/session/[A-Za-z0-9_-]{24}/upload$" {
        limit_except POST { deny all; }
        proxy_pass $photobooth_api;
    }
    location ~ "^/api/v1/(photos/[a-f0-9]{32}|results/[a-f0-9]{32}/(image|download))$" {
        limit_except GET { deny all; }
        proxy_pass $photobooth_api;
    }
    # Compatibility for legacy session+multipart clients; new desktop uses split API.
    location ~ "^/api/v1/(photo-sessions|upload-image)/?$" {
        limit_except POST { deny all; }
        proxy_pass $photobooth_api;
    }
    location / { return 404; }
}
