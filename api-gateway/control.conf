# Dedicated control process. No image upload/download routes are proxied.

map "$request_method:$http_content_type" $photobooth_control_type {
    default 0;
    "~^(GET|HEAD|OPTIONS):$" 1;
    "~*^(GET|HEAD|OPTIONS|POST|PUT|PATCH|DELETE):application/json([[:space:]]*;.*)?$" 1;
}
limit_req_zone $binary_remote_addr zone=photobooth_control:10m rate=20r/s;
log_format photobooth_control '$request_id $request_method $status $body_bytes_sent $request_time';
server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    access_log /dev/stdout photobooth_control;
    # Request paths can carry identifiers; disable raw URI error logs as well.
    error_log /dev/null;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "private, no-store" always;
    limit_req zone=photobooth_control burst=40 nodelay;
    limit_req_status 429;
    if ($photobooth_control_type = 0) { return 415; }
    location = /gateway/health { access_log off; return 200 '{"status":"ok","service":"photobooth-control-gateway"}'; }
    location = /api/health { include /etc/nginx/conf.d/proxy-control.inc; }
    location ~ "^/api/v1/(kiosk/sessions|photo-sessions/[A-Za-z0-9_-]{24}(/claim|/generations)?|generations(/[a-f0-9]{32})?|frames(/[A-Za-z0-9_-]+)?|frame/[A-Za-z0-9_-]+|templates|experiences|frame-styles|ornaments|photos/[a-f0-9]{32}/url|image/[a-f0-9]{32}|results/[a-f0-9]{32}(/url|/claim)?)$" {
        include /etc/nginx/conf.d/proxy-control.inc;
    }
    location / { return 404; }
}
